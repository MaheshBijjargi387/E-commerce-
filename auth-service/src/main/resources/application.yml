server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # --- Default: in-memory H2 for easy local run ---
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # --- To use MySQL instead, comment the H2 lines above and uncomment below ---
    # url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # IMPORTANT: this secret MUST be identical across auth-service, product-service
  # and order-service so tokens issued here validate correctly there.
  secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A713474"
  expiration-ms: 86400000   # 24 hours
